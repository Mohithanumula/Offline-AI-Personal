<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Offline AI Personal Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: #f9a825;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #1a2e44;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #1a2e44;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1a2e44;
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            font-size: 13px;
            color: #90a4ae;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #1a2e44;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e0e6ed;
            border-radius: 10px;
            font-size: 14px;
            color: #1a2e44;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #f9a825;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #f9a825;
            color: #1a2e44;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background: #e65100;
            color: #fff;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #607d8b;
        }

        .switch a {
            color: #f9a825;
            font-weight: 700;
            text-decoration: none;
        }

        .switch a:hover {
            color: #e65100;
        }

        .offline-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            font-size: 11px;
            color: #4caf50;
            font-weight: 700;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #4caf50;
            border-radius: 50%;
        }

        .password-hint {
            font-size: 11px;
            color: #90a4ae;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo">
            <div class="logo-icon">AI</div>
            <div class="logo-text">Personal AI Manager</div>
        </div>

        <h2>Create account</h2>
        <p class="subtitle">Register to get started with your personal AI</p>

        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password" />
            <p class="password-hint">Minimum 6 characters</p>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password"
                onkeypress="handleKey(event)" />
        </div>

        <button class="btn" onclick="register()">Create Account</button>

        <div class="switch">
            Already have an account? <a href="login.html">Login here</a>
        </div>

        <div class="offline-badge">
            <div class="dot"></div>
            100% Offline — your data never leaves your computer
        </div>

    </div>

    <script>
        // If already logged in redirect to chat
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        function handleKey(e) {
            if (e.key === 'Enter') register();
        }

        async function register() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!name || !email || !password || !confirmPassword) {
                showError('Please fill in all fields!');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters!');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match!');
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showSuccess('Account created! Redirecting...');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showError(data.error);
                }
            } catch (err) {
                showError('Server not running! Please start the server.');
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }
    </script>
</body>

</html>
